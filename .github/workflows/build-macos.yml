name: Build macOS

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run frontend tests
        working-directory: app
        run: npm test

      - name: Build universal macOS app
        working-directory: app
        run: npm run tauri -- build --target universal-apple-darwin

      - name: Archive app bundle
        working-directory: app
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/NJU Beamer.app" NJU-Beamer-macOS.zip

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: NJU-Beamer-macOS-${{ github.sha }}
          path: app/NJU-Beamer-macOS.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: NJU-Beamer-macOS-${{ github.sha }}
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME"; then
            gh release upload "$GITHUB_REF_NAME" release-assets/NJU-Beamer-macOS.zip release/tutor.pdf --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/NJU-Beamer-macOS.zip release/tutor.pdf --verify-tag --generate-notes --title "NJU Beamer $GITHUB_REF_NAME"
          fi
