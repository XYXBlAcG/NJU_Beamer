[package]
name = "nju-beamer-editor"
version = "0.3.0"
description = "A visual XeTeX Beamer editor"
authors = ["NJU Beamer contributors"]
edition = "2021"

[lib]
name = "nju_beamer_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication"] }
foreign-types = "0.5"
png = "0.18"

[dev-dependencies]
