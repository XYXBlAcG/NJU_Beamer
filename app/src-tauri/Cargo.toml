[package]
name = "nju-beamer-editor"
version = "0.1.0"
description = "A visual XeTeX Beamer editor"
authors = ["NJU Beamer contributors"]
edition = "2021"

[lib]
name = "nju_beamer_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
